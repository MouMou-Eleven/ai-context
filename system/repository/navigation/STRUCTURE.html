<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>建委知识导航｜AI Context</title>
  <style>
    :root {
      --page: #f7f9fb;
      --surface: #ffffff;
      --surface-subtle: #f3f6f8;
      --text: #162229;
      --muted: #65757f;
      --faint: #8b989f;
      --line: #d9e2e7;
      --line-strong: #bdcbd2;
      --accent: #087f8c;
      --accent-dark: #075f69;
      --accent-soft: #e7f5f6;
      --match: #fff1a8;
      --focus: #0b7682;
      --shadow: 0 8px 28px rgba(28, 54, 67, 0.08);
      --radius: 14px;
      --font-ui: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      --font-code: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.55;
    }

    button, input { font: inherit; }

    a { color: var(--accent-dark); }

    button { color: inherit; }

    .app-header {
      position: sticky;
      z-index: 20;
      top: 0;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1680px;
      margin: 0 auto;
      padding: 20px 28px 16px;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .source-state {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .source-state strong {
      display: block;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--surface);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: border-color 140ms ease, background 140ms ease, color 140ms ease;
    }

    .tool-button:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .view-switch { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-subtle); }
    .view-button { padding: 8px 15px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 700; }
    .view-button[aria-pressed="true"] { background: var(--accent-dark); color: white; }

    .view-button:focus-visible,
    .node-toggle:focus-visible,
    .node-link:focus-visible,
    .tool-button:focus-visible,
    .search-input:focus-visible,
    .node-row:focus-visible,
    .quick-link:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 28%, transparent);
      outline-offset: 2px;
    }

    .tool-button svg,
    .search-box svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .search-box {
      position: relative;
      flex: 1 1 280px;
      min-width: 220px;
      max-width: 540px;
      margin-left: 8px;
    }

    .search-box > svg {
      position: absolute;
      top: 50%;
      left: 13px;
      color: var(--faint);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 40px;
      padding: 8px 74px 8px 40px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
    }

    .search-input::placeholder { color: var(--faint); }

    .shortcut {
      position: absolute;
      top: 50%;
      right: 10px;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-subtle);
      color: var(--faint);
      font-family: var(--font-code);
      font-size: 11px;
      transform: translateY(-50%);
    }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 20px;
      width: min(1680px, 100%);
      margin: 0 auto;
      padding: 22px 28px 48px;
    }

    .sidebar {
      position: sticky;
      top: 230px;
      align-self: start;
      max-height: calc(100vh - 252px);
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .side-heading {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .quick-nav {
      display: grid;
      gap: 5px;
      margin: 0 0 20px;
    }

    .quick-link {
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      font-size: 13px;
    }

    .quick-link:hover {
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }

    .stat {
      padding: 10px;
      border-top: 2px solid var(--line-strong);
      background: var(--surface-subtle);
    }

    .stat strong {
      display: block;
      font-family: var(--font-code);
      font-size: 18px;
      line-height: 1.2;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .legend {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-icon {
      display: inline-flex;
      width: 18px;
      height: 18px;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .tree-panel {
      min-width: 0;
      padding: 22px 24px 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .tree-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 30px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .tree-meta strong { color: var(--text); }

    .tree-scroll {
      min-width: 0;
      overflow-x: auto;
      padding: 2px 4px 14px;
    }

    .tree,
    .tree ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tree-root { min-width: 0; }
    body[data-view="files"] .tree-root { min-width: 720px; }

    .tree-children {
      position: relative;
      margin-left: 25px !important;
      padding-left: 25px !important;
    }

    .tree-children::before {
      position: absolute;
      top: 0;
      bottom: 18px;
      left: 9px;
      width: 1px;
      background: var(--line);
      content: "";
    }

    .tree-item {
      position: relative;
      padding: 2px 0;
    }

    .tree-children > .tree-item::before {
      position: absolute;
      top: 23px;
      left: -16px;
      width: 16px;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .node-row {
      display: grid;
      grid-template-columns: 26px 22px minmax(160px, auto) minmax(120px, 1fr);
      align-items: center;
      gap: 7px;
      width: 100%;
      min-height: 42px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      text-align: left;
    }

    .node-row:hover,
    .node-row.is-expanded {
      border-color: #c9e6e9;
      background: var(--accent-soft);
    }

    .node-row.is-root {
      margin-bottom: 4px;
      border-color: #b6dadd;
      background: #edf8f9;
    }

    .toggle-space,
    .node-toggle { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: transparent; cursor: pointer; }
    .node-toggle:hover { background: #c9e6e9; }

    .toggle-icon {
      display: inline-flex;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
    }

    .toggle-icon {
      border-radius: 5px;
      color: var(--muted);
      transition: transform 140ms ease;
    }

    .toggle-icon svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .is-expanded .toggle-icon { transform: rotate(90deg); }

    .type-icon {
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .type-icon.file { color: #78868e; }

    .type-icon svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    .node-name {
      min-width: 0;
      color: var(--text);
      font-family: var(--font-code);
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .folder-node .node-name { color: var(--accent-dark); }

    body[data-view="knowledge"] .node-name { font-family: var(--font-ui); font-size: 14px; }
    .node-link { text-decoration: none; }
    .node-link:hover { text-decoration: underline; text-underline-offset: 3px; }
    .node-link::after { content: " ↗"; font-size: 10px; color: var(--faint); }

    .node-description {
      min-width: 0;
      padding-left: 14px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    mark {
      padding: 0 2px;
      border-radius: 3px;
      background: var(--match);
      color: inherit;
    }

    .empty-state {
      display: none;
      padding: 70px 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 16px;
    }

    .footer-note {
      margin: 18px 0 0;
      color: var(--faint);
      font-size: 11px;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .footer-note summary { cursor: pointer; }

    @media (max-width: 980px) {
      .header-inner { padding: 16px 18px 14px; }
      .title-row { margin-bottom: 13px; }
      .source-state { display: none; }
      .layout { grid-template-columns: 1fr; padding: 16px 18px 36px; }
      .sidebar { display: none; }
      .quick-nav { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
      .stats { grid-template-columns: repeat(4, 1fr); }
      .tree-panel { padding: 18px 14px 26px; }
    }

    @media (max-width: 640px) {
      .title-row { display: block; }
      .toolbar { align-items: stretch; }
      .tool-button { flex: 1 1 calc(33.333% - 6px); padding-inline: 5px; gap: 4px; font-size: 12px; white-space: nowrap; }
      .search-box { order: -1; flex-basis: 100%; max-width: none; margin: 0 0 3px; }
      .layout { padding-inline: 10px; }
      .sidebar { padding: 14px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .tree-meta { align-items: flex-start; flex-direction: column; gap: 3px; }
      .node-row { grid-template-columns: 22px 22px minmax(190px, 1fr); }
      .node-description { grid-column: 3; padding: 0; border: 0; }
      body[data-view="knowledge"] .node-row { grid-template-columns: 26px 20px minmax(0, 1fr); gap: 5px; padding-inline: 3px; }
      body[data-view="knowledge"] .node-description { display: block; }
      body[data-view="knowledge"] .tree-children { margin-left: 10px !important; padding-left: 10px !important; }
      body[data-view="knowledge"] .tree-children::before { left: 2px; }
      body[data-view="knowledge"] .tree-children > .tree-item::before { left: -8px; width: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }

    @media print {
      .app-header, .sidebar { position: static; }
      .toolbar { display: none; }
      .layout { display: block; padding: 0; }
      .sidebar { margin-bottom: 16px; box-shadow: none; }
      .tree-panel { box-shadow: none; }
      .tree-scroll { overflow: visible; }
      .tree-root { min-width: 0; }
    }
  </style>
</head>

          const branch = line.match(/^((?:(?:│   |    ))*)(?:├── |└── )(.*)$/u);

          output += escapeHtml(value.slice(start, match.index)) + `<mark>${escapeHtml(match[0])}</mark>`;
          start = match.index + match[0].length;
        }
        return output + escapeHtml(value.slice(start));
      }

      function matches(node) {
        if (!query) return true;
        return `${node.name} ${node.description} ${node.path}`.toLocaleLowerCase("zh-CN").includes(query.toLocaleLowerCase("zh-CN"));
      }

      function hasVisibleDescendant(node) {
        return node.children.some(child => matches(child) || hasVisibleDescendant(child));
      }

      function isVisible(node) {
        return !query || matches(node) || hasVisibleDescendant(node);
      }

      function nodeUrl(node) {
        const path = node.entry || node.path;
        if (!path) return repositoryUrl;
        return repositoryUrl + (node.entry || !node.isFolder ? "/blob/main/" : "/tree/main/") +
          path.split("/").map(encodeURIComponent).join("/");
      }

      function renderNode(node) {
        if (!isVisible(node)) return null;
        const item = document.createElement("li");
        item.className = "tree-item";
        item.id = node.id;
        item.setAttribute("role", "treeitem");
        item.setAttribute("aria-level", String(node.depth + 1));

        const expandable = node.isFolder && node.children.length > 0;
        const open = query ? hasVisibleDescendant(node) : node.expanded;
        if (expandable) item.setAttribute("aria-expanded", String(open));

        const row = document.createElement("div");
        row.className = `node-row ${node.isFolder ? "folder-node" : "file-node"} ${open ? "is-expanded" : ""} ${node.depth === 0 ? "is-root" : ""}`;
        row.innerHTML = `
          ${expandable ? `<button class="node-toggle" type="button" aria-expanded="${open}" aria-label="${open ? "收起" : "展开"} ${escapeHtml(node.name)}"><span class="toggle-icon">${icons.chevron}</span></button>` : '<span class="toggle-space"></span>'}
          <span class="type-icon ${node.isFolder ? "folder" : "file"}">${node.isFolder ? icons.folder : icons.file}</span>
          <a class="node-name node-link" href="${escapeHtml(nodeUrl(node))}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(node.entry || node.path || '仓库首页')} · 在 GitHub 打开">${highlighted(node.name)}</a>
          <span class="node-description">${highlighted(node.description || "")}</span>`;
        if (expandable) {
          row.querySelector(".node-toggle").addEventListener("click", () => {
            if (query) {
              query = "";
              searchInput.value = "";
              let ancestor = node.parent;
              while (ancestor) { ancestor.expanded = true; ancestor = ancestor.parent; }
            }
            node.expanded = !open;
            saveState();
            render();
            document.getElementById(node.id)?.querySelector(".node-toggle")?.focus({ preventScroll: true });
          });
        }
        item.appendChild(row);

        if (expandable && open) {
          const children = document.createElement("ul");
          children.className = "tree-children";
          children.setAttribute("role", "group");
          node.children.forEach(child => {
            const rendered = renderNode(child);
            if (rendered) children.appendChild(rendered);
          });
          if (children.childElementCount) item.appendChild(children);
        }
        return item;
      }

      function countVisible(node) {
        if (!isVisible(node)) return 0;
        const open = query ? hasVisibleDescendant(node) : node.expanded;
        return 1 + (open ? node.children.reduce((sum, child) => sum + countVisible(child), 0) : 0);
      }

      function render() {
        treeElement.replaceChildren();
        const renderedRoot = renderNode(root);
        if (renderedRoot) treeElement.appendChild(renderedRoot);
        const shown = countVisible(root);
        document.getElementById("visible-count").textContent = String(shown);
        document.getElementById("folder-count").textContent = String(allNodes.filter(node => node.isFolder && node.depth > 0).length);
        document.getElementById("file-count").textContent = String(allNodes.filter(node => !node.isFolder).length);
        document.getElementById("level-count").textContent = String(Math.max(...allNodes.map(node => node.depth)));
        emptyState.style.display = shown ? "none" : "block";
        treeElement.style.display = shown ? "block" : "none";
        if (query) {
          const directMatches = allNodes.filter(matches).length;
          resultStatus.textContent = `找到 ${directMatches} 个匹配项`;
        } else {
          resultStatus.textContent = `当前显示 ${shown} 个节点，共 ${allNodes.length} 个`;
        }
      }

      function setExpansion(mode) {
        query = "";
        searchInput.value = "";
        allNodes.forEach(node => {
          if (!node.isFolder) return;
          if (mode === "all") node.expanded = true;
          if (mode === "none") node.expanded = false;
          if (mode === "level-one") node.expanded = node.depth === 0;
        });
        saveState();
        render();
      }

      function revealNode(node) {
        query = "";
        searchInput.value = "";
        allNodes.forEach(item => {
          if (item.isFolder) item.expanded = item.depth === 0;
        });
        let cursor = node.parent;
        while (cursor) {
          cursor.expanded = true;
          cursor = cursor.parent;
        }
        node.expanded = true;
        saveState();
        render();
        requestAnimationFrame(() => document.getElementById(node.id)?.scrollIntoView({ behavior: "smooth", block: "center" }));
      }

      function buildQuickNav() {
        const nav = document.getElementById("quick-nav");
        nav.replaceChildren();
        root.children.filter(node => node.isFolder).forEach(node => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "quick-link";
          button.textContent = currentView === "knowledge" ? node.name : node.name.replace(/\/$/, "");
          button.addEventListener("click", () => revealNode(node));
          nav.appendChild(button);
        });
      }

      function setView(view) {
        if (!Object.hasOwn(roots, view)) return;
        currentView = view;
        root = roots[view];
        allNodes = nodesByView[view];
        query = "";
        searchInput.value = "";
        const knowledge = view === "knowledge";
        document.body.dataset.view = view;
        document.getElementById("view-knowledge").setAttribute("aria-pressed", String(knowledge));
        document.getElementById("view-files").setAttribute("aria-pressed", String(!knowledge));
        document.getElementById("view-subtitle").textContent = knowledge ?
          "杨建委的长期 AI 协作上下文 · 按知识分类浏览" : "维护查看：同一仓库的全部文件，包含脚本、配置与源码";
        document.getElementById("nav-heading").textContent = knowledge ? "四个主入口" : "一级目录";
        document.getElementById("folder-label").textContent = knowledge ? "分类入口" : "文件夹";
        document.getElementById("file-label").textContent = knowledge ? "内容条目" : "文件";
        document.getElementById("tree-heading").innerHTML = knowledge ?
          "<strong>日常知识导航</strong>" : "<strong>完整文件视图（维护用）</strong>";
        document.getElementById("maintenance-view").open = !knowledge;
        searchInput.placeholder = knowledge ? "搜索知识、项目或经验" : "搜索目录、文件或用途";
        restoreState();
        buildQuickNav();
        render();
      }

      document.getElementById("expand-all").addEventListener("click", () => setExpansion("all"));
      document.getElementById("collapse-all").addEventListener("click", () => setExpansion("none"));
      document.getElementById("level-one").addEventListener("click", () => setExpansion("level-one"));
      document.getElementById("view-knowledge").addEventListener("click", () => setView("knowledge"));
      document.getElementById("view-files").addEventListener("click", () => setView("files"));
      searchInput.addEventListener("input", event => {
        query = event.target.value.trim();
        render();
      });
      document.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          searchInput.focus();
        }
        if (event.key === "Escape" && document.activeElement === searchInput) {
          searchInput.value = "";
          query = "";
          render();
        }
      });

      setView("knowledge");

      window.__STRUCTURE_VIEWER_TEST__ = {
        get view() { return currentView; },
        get totalNodes() { return allNodes.length; },
        get folderCount() { return allNodes.filter(node => node.isFolder && node.depth > 0).length; },
        get fileCount() { return allNodes.filter(node => !node.isFolder).length; },
        get deepestLevel() { return Math.max(...allNodes.map(node => node.depth)); },
        viewNodeCounts: Object.fromEntries(Object.entries(nodesByView).map(([view, nodes]) => [view, nodes.length])),
        setView,
        expandAll: () => setExpansion("all"),
        collapseAll: () => setExpansion("none"),
        search: value => {
          searchInput.value = value;
          searchInput.dispatchEvent(new Event("input", { bubbles: true }));
        }
      };
    })();
  </script>
</body>
</html>
